<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>The Queen — الاتصال بالخادم</title>
<style>
  :root { --accent: #6b1d3a; --line: #e3e5e9; --muted: #6b7280; --err: #b42318; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f5f7; font: 13px/1.5 "Segoe UI", Tahoma, sans-serif; color: #1d2129; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mark { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  h1 { font-size: 15px; margin: 0; } .sub { color: var(--muted); font-size: 12px; }
  .list { border: 1px solid var(--line); border-radius: 6px; margin: 10px 0; min-height: 44px; }
  .it { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #eef0f3; cursor: pointer; }
  .it:last-child { border: 0; } .it:hover { background: #f7eef2; }
  .it b { flex: 1; } .it span { color: var(--muted); direction: ltr; }
  .empty { padding: 12px; color: var(--muted); text-align: center; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 4px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; direction: ltr; text-align: left; outline: none; }
  input:focus { border-color: var(--accent); }
  button { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.p { background: var(--accent); border-color: var(--accent); color: #fff; }
  .err { color: var(--err); min-height: 18px; margin-top: 10px; font-size: 12.5px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.7; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #ddd; border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <div class="brand"><div class="mark">Q</div><div><h1>The Queen — الكاشير</h1><div class="sub">الاتصال بجهاز الإدارة (الخادم)</div></div></div>
  <div class="row" style="align-items:center"><b style="flex:1">الأجهزة المتوفرة على الشبكة</b><button id="scan">بحث مجدداً</button></div>
  <div class="list" id="list"><div class="empty"><span class="spin"></span> جارٍ البحث…</div></div>
  <label>أو أدخل عنوان جهاز الإدارة يدوياً</label>
  <div class="row"><input id="addr" placeholder="192.168.1.10:3000"><button class="p" id="go">اتصال</button></div>
  <div class="err" id="err"></div>
  <div class="hint">• يجب أن يكون برنامج <b>The Queen — الإدارة</b> مفتوحاً على الجهاز الرئيسي.<br>• يجب أن يكون الجهازان على نفس الشبكة (نفس الراوتر).<br>• العنوان يظهر في النظام الإداري ← الإعدادات ← روابط النظام.</div>
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (q.get('error')) $('err').textContent = q.get('error');
  if (q.get('server')) $('addr').value = q.get('server').replace(/^https?:\/\//, '');
  async function connect(url) {
    $('err').textContent = ''; $('go').disabled = true;
    const r = await window.desktop.connect(url);
    $('go').disabled = false;
    if (!r.ok) $('err').textContent = r.error;
  }
  async function scan() {
    $('list').innerHTML = '<div class="empty"><span class="spin"></span> جارٍ البحث…</div>';
    const found = await window.desktop.discover();
    $('list').innerHTML = found.length
      ? found.map((f) => `<div class="it" data-u="${esc(f.address)}"><b>${esc(f.name || 'The Queen')}</b><span>${esc(f.ip)}</span></div>`).join('')
      : '<div class="empty">لم يتم العثور على جهاز. أدخل العنوان يدوياً.</div>';
    document.querySelectorAll('[data-u]').forEach((el) => (el.onclick = () => connect(el.dataset.u)));
  }
  $('scan').onclick = scan;
  $('go').onclick = () => $('addr').value.trim() && connect($('addr').value);
  $('addr').onkeydown = (e) => e.key === 'Enter' && $('go').click();
  if (q.get('searching')) $('list').innerHTML = '<div class="empty"><span class="spin"></span> جارٍ الاتصال تلقائياً…</div>';
  else scan();
</script>
</body>
</html>
